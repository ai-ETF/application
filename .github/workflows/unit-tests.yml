name: 前端单元/集成测试

# 干什么：每次 push / PR 自动跑 `npm run test:unit`（vitest）。
# 这一层是**纯逻辑**的：用假的 uni 桩跑，不开微信开发者工具、不联网、不起后端，5 秒跑完。
# 它是本项目唯一能进 CI 的前端测试层。
#
# ⚠️ 不要在这里加 `npm run test:e2e`：那要 Windows + 微信开发者工具开着界面 + 本地后端
#    （端口 9520/9420、node_modules 补丁、夹具），Linux runner 上必然失败。
#    分层依据见 ai-etf/docs/e2e/02-核心路径与分层策略.md。
#
# 本工作流里跑的就是本机实测过的那条命令：当前 92 条、6 个文件、约 1 秒。
# （2026-10-11 补了 useAuth.login 的 6 条后从 86 条/5 文件变成 92 条/6 文件。）

on:
  push:
  pull_request:
  workflow_dispatch: # 允许在网页上手动点一次

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本机实测环境一致（v22.21.0）——E2E 也是在 Node 22 上跑通的，
          # 固定住可以避免 Node 大版本变化带来的意外（项目历史上被 Node 24 坑过一次）。
          node-version: "22"
          cache: npm # 按 package-lock.json 缓存 npm 下载目录

      - name: 安装依赖
        run: npm ci

      - name: 跑单元/集成测试
        run: npm run test:unit
